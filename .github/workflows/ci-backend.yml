name: CI Backend

on:
  workflow_dispatch:
  push:
    branches: [ new-branch ]
  pull_request:
    branches: [ new-branch ]

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install backend deps
        run: npm ci
        working-directory: backend

      - name: Run tests against real Mongo service
        run: |
          export MONGO_URI="mongodb://localhost:27017/zeycake_test"
          npm run test:ci
        working-directory: backend
        env:
        MONGO_URI: ${{ secrets.MONGO_URI }}

      - name: Upload coverage
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: couverture-backend
          path: backend/coverage
