name: ci-backend

on:
  push:
    branches: [ new-branch ]
  pull_request:
    branches: [ new-branch ]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: superSecret
      JWT_EXPIRES_IN: 7d

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer libssl1.1 (pour libcrypto.so.1.1)
        run: |
          sudo apt-get update
          if ! dpkg -s libssl1.1 >/dev/null 2>&1; then
            sudo apt-get install -y libssl1.1 || {
              wget https://archive.ubuntu.com/ubuntu/pool/main/o/openssl1.1/libssl1.1_1.1.1f-1ubuntu2_amd64.deb
              sudo dpkg -i libssl1.1_1.1.1f-1ubuntu2_amd64.deb
            }
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Installer les dépendances du backend
        run: npm ci
        working-directory: backend

      - name: Lancer les tests avec couverture
        run: npm run test:ci
        working-directory: backend

      - name: Upload couverture
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: couverture-backend
          path: backend/coverage
