name: Exécution automatique backend

on:
  push:
    branches: [ new-branch ]
  pull_request:
    branches: [ new-branch ]

jobs:
  tests:
    runs-on: ubuntu-20.04  # nécessaire pour libssl1.1
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Installer libssl1.1 
        run: |
          sudo apt-get update
          if ! dpkg -s libssl1.1 >/dev/null 2>&1; then
            sudo apt-get install -y libssl1.1 || {
              wget https://archive.ubuntu.com/ubuntu/pool/main/o/openssl1.1/libssl1.1_1.1.1f-1ubuntu2_amd64.deb
              sudo dpkg -i libssl1.1_1.1.1f-1ubuntu2_amd64.deb
            }
          fi

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Installation des dépendances backend
        run: npm ci
        working-directory: backend

      - name: Lancement des tests avec couverture
        run: npm run test:ci
        working-directory: backend
        env:
          DEBUG: mongodb-memory-server*  

      - name: Sauvegarde de la couverture
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-couverture
          path: backend/coverage
